; PlatformIO Project Configuration File
; Smart Home Platform - IoT Smart Exhaust Fan (ESP32 / ESP8266)
; Features: Dual-relay AC switching, Servo duct pull mechanism, Dual limit-switch feedback, Non-blocking FSM

[platformio]
default_envs = esp32dev

[env]
framework = arduino
monitor_speed = 115200
lib_deps =
    knolleary/PubSubClient @ ^2.8
    bblanchon/ArduinoJson @ ^7.0.4

; ESP32 Dev Module (Recommended for full servo + 2-relay + 2-limit switch)
[env:esp32dev]
platform = espressif32
board = esp32dev
lib_deps =
    ${env.lib_deps}
    madhephaestus/ESP32Servo @ ^3.0.5

; ESP8266 NodeMCU v2
[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
