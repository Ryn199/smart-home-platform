name: Build and Push Docker Images to Docker Hub

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ryn19/smarthome-backend:latest,ryn19/smarthome-backend:${{ github.sha }}

      - name: Build and Push Web-Admin Image
        uses: docker/build-push-action@v5
        with:
          context: ./web-admin
          file: ./web-admin/Dockerfile
          push: true
          tags: ryn19/smarthome-web-admin:latest,ryn19/smarthome-web-admin:${{ github.sha }}
