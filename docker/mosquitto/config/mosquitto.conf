# Mosquitto Configuration for Smart Home IoT

# Global options
allow_anonymous false
password_file /mosquitto/config/pwfile
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest stdout
log_dest file /mosquitto/log/mosquitto.log
log_type error
log_type warning
log_type notice
log_type information

# MQTT Default Listener (TCP)
listener 1883 0.0.0.0
protocol mqtt

# MQTT WebSocket Listener (for future web admin / testing)
listener 9001 0.0.0.0
protocol websockets
