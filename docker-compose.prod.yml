services:
  postgres:
    image: postgres:16-alpine
    container_name: smarthome_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-smarthome}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smarthome_secret}
      POSTGRES_DB: ${POSTGRES_DB:-smarthome_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-smarthome} -d ${POSTGRES_DB:-smarthome_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: smarthome_mosquitto
    restart: always
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./docker/mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 1883 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    image: ryn19/smarthome-backend:latest
    container_name: smarthome_backend
    restart: always
    environment:
      PORT: ${PORT:-3000}
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: ${DATABASE_URL:-postgresql://smarthome:smarthome_secret@postgres:5432/smarthome_db?schema=public}
      MQTT_BROKER_URL: ${MQTT_BROKER_URL:-mqtt://mosquitto:1883}
      JWT_SECRET: ${JWT_SECRET:-change_this_to_a_secure_jwt_secret_key}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      BACKEND_URL: ${BACKEND_URL}
      DEVICE_OFFLINE_THRESHOLD_SECONDS: ${DEVICE_OFFLINE_THRESHOLD_SECONDS:-60}
    ports:
      - "${PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_healthy

  web-admin:
    image: ryn19/smarthome-web-admin:latest
    container_name: smarthome_web_admin
    restart: always
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  postgres_data:
    driver: local
  mosquitto_data:
    driver: local
  mosquitto_log:
    driver: local
